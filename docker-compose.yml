# version: '3.8'
services:
  api:
    build: .
    ports:
      - "2090:2090" 
    volumes:
      - .:/app
    command: npm run dev
    networks:
      - shared_network

  mongo:
    image: mongo:6
    ports:
      - "2091:27017"

    container_name: my_book_journal
    volumes:
      - mongo_data:/data/db
    networks:
      - shared_network

volumes:
  mongo_data:

networks:
  shared_network: 